; cities.ini - a per-city radius and shape.
;
; A city in the base game is a name, a position, and a circle of exactly
; 1000 m around it: every building inside that circle belongs to it, and the
; number is one constant shared by every city on the map. This plugin makes
; the radius per-city, adds a square shape, puts both on the city's own
; information window, and gives a city of its own to anything that ends up
; outside every one of them.
;
; The defaults below are the base game exactly: 1000 m, circular. Nothing
; changes until a slider is moved.
;
; The per-city figures live in the save - appended to namepoints.bin after
; everything the game writes there, which the game itself never reads - so a
; save made with this plugin still loads without it. What it will not carry
; back is the radii: every city goes back to 1000 m and the buildings are
; reassigned accordingly.

[cities]

; The whole plugin. 0 leaves the game exactly as it was.
enabled    = 1

; The two extra rows on the city window: the radius slider and the shape
; checkbox. 0 keeps the mechanic and takes away the only way to drive it.
window     = 1

; Shrinking a city can leave a building with no city at all, which the base
; game has no concept of. With this on, every such building is handed to the
; game's own city-creation function - random unused name, current date as
; "date established" - exactly as if it had been built there in the wild.
; With it off they simply have no city, which is untested territory.
adopt      = 1

; What a city that has never been touched uses. 1000 and circular is the base
; game; anything else changes every city on every map at once.
radius     = 1000
square     = 0

; What the ends of the slider mean. The slider is the game's own 0..100
; widget, so this is also its resolution: with 200..5000 one step of the - / +
; buttons is 48 m per `step` below.
radius_min = 200
radius_max = 5000

; Percent per click of the slider's - and + buttons. Dragging the bar itself
; ignores this.
step       = 2

; Where the two rows sit inside the window, in the game's own unscaled layout
; units, measured from the panel's left edge. The label is printed at label_x
; and the widget starts at widget_x; the window is about 500 units wide and
; the slider needs about 225 of them.
label_x    = 10
widget_x   = 200

; The shape checkbox draws itself ABOVE the position it is given - the box 25
; units up and its label 37 - which is how the game's own "Allow citizens to
; move into this city" row is laid out. Left uncompensated it lands a third of
; a row high and sits on the slider, so this is added back. Raise it to push
; the row further down, lower it to pull it up.
checkbox_dy = 25

; The blue dot grid the game paints on the ground while a city window is open.
; The game walks a fixed 1000 m circle around the city and puts a dot wherever
; the city search says "this belongs here" - so without this the dots ignore
; both a raised radius and a square shape entirely, because the corners and
; anything past 1000 m are simply never sampled. 0 leaves that alone.
overlay      = 1

; The spacing of that grid, in metres. 0 makes it follow the radius - one
; twentieth of it, never finer than the game's own 50 - because the scan is
; quadratic: at 5000 m and a fixed 50 m step the game would test 200x200
; points against every city on the map, every frame the window is open.
overlay_step = 0

; Prints the whole city table after every load - radius, shape and how many
; buildings ended up in each - plus one line per frame while a city window is
; open showing what the slider did with the value. That last one is the way to
; tell "the widget never fired" from "something put the value back".
probe      = 0
