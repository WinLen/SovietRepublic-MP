; daynight.ini - one sunrise and one sunset per calendar day.
;
; The base game keeps two clocks and runs them at different speeds. The date in
; the corner advances once every 60 units of game time; the day/night cycle is
; a thirteen-step state machine that steps once per *calendar day*, so a full
; cycle takes thirteen of them and the night part lasts two. That is why the
; date can run through a fortnight between one sunrise and the next.
;
; This plugin hands the game's own machine a date derived from the position
; inside the current day instead of from the calendar, so the whole thirteen
; step cycle fits inside one day. Nothing is patched and nothing is
; reimplemented: the same weathers/*.ini files, the same fades, the same
; proportions - only compressed.

[daynight]

; The whole plugin. 0 leaves the game exactly as it was.
enabled    = 1

; How many calendar days one full day/night cycle takes.
;
;   1    one sunrise and one sunset per day - what this plugin is for
;   13   the base game, exactly. Not "almost": the mapping is short circuited
;        at 13 so it is the identity, which makes it the control to test
;        against when something looks wrong
;   2-12 in between, for a longer day than the calendar has but shorter than
;        the vanilla fortnight
;
; The cycle is aligned to the calendar: it always restarts on a day whose
; number is a multiple of this.
cycle_days = 1

; How many times longer a calendar day lasts than in the base game.
;
; This is not optional decoration - it is the other half of the same problem.
; The two clocks have a fixed ratio: thirteen calendar days to one day/night
; cycle. Squeezing the cycle into one day (above) does not slow the calendar,
; so the cycle comes out thirteen times FASTER than the base game's, and an
; in-game day is only a few seconds of real time. Night becomes a flicker that
; looks like "it tried to get dark and changed its mind".
;
;   auto   PHASES / cycle_days - the value that leaves one whole day/night
;          cycle taking exactly as long in real time as it did in the base
;          game. With cycle_days = 1 that is 13. This is the default
;   1      the calendar keeps its own speed. The cycle then runs 13x faster
;          than the base game's - correct, synchronised, and too quick to see
;   2-100  anything in between
;
; See `slow` below for what this actually stretches.
day_scale  = auto

; What day_scale stretches. This is the setting worth reading in full - the
; wrong choice here is either "pollution runs away" or "everyone walks in slow
; motion", and both have happened.
;
;   calendar  THE DEFAULT. Only the calendar field is touched - nothing about
;             C3D_TIMER, the shared clock walking, vehicles, construction,
;             production and every animation are integrated from. So the date
;             and the day/night cycle run slower, on the wall clock, and
;             EVERYTHING ELSE KEEPS THE BASE GAME'S OWN REAL-TIME PACE.
;
;             This is exactly what version 1.x did, and version 1.x was
;             broken: three things that are called once per calendar day -
;             pollution decay, loan repayment, notification/offer expiry -
;             would then fire day_scale times less often than the per-frame
;             systems (emission, income) they are meant to balance, and
;             pollution ran away, loans never moved and citizens sickened in
;             a winter that both ran away and lasted too long.
;
;             What makes this the default now is that the plugin drives those
;             three functions ITSELF, directly, at the pace the un-slowed
;             calendar would have used - independent of how rarely the
;             (deliberately slowed) calendar actually rolls over. So pollution
;             still decays and loans still get paid at the base game's own
;             rate, while the date and the sky move at the slower, watchable
;             one. Nothing else needed the same treatment because nothing
;             else both integrates real time AND is called only once a
;             calendar day - see docs/15-daynight.md for the full list of what
;             was checked.
;
;   world     version 2.0's approach: scale the whole simulation clock - the
;             one C3D_TIMER every rate in the game is integrated from - so
;             production, consumption, heating, pollution, wear, loans,
;             walking and vehicle speed all slow by exactly the same factor.
;             The economy is then bit-for-bit the base game's, only slower on
;             the wall clock, which is the most honest answer there is - but
;             it also means citizens walk in visible slow motion and vehicles
;             crawl at the default 13x, which reads as the whole world
;             stuck rather than merely a longer day. Opt into this if that
;             uniform slowdown is what you actually want, e.g. for a
;             deliberately cinematic pace.
;
;   none      do not stretch anything. Same as day_scale = 1
slow       = calendar

; Two more dials, completely independent of `slow` and `day_scale` above -
; they work in every mode, including `slow = calendar`'s default where the
; calendar stretch does not touch them at all. This is what lets you rebalance
; vehicles against pedestrians, or the pace of the simulation in general,
; without that decision being tangled up with how long a calendar day lasts.
;
; Both work like day_scale: > 1 is slower, < 1 is faster, 1 is unchanged - but
; unlike day_scale, going faster IS on offer here, because "vehicles feel
; slower than pedestrians, even in vanilla" is exactly the kind of thing these
; exist to let you correct.
;
; WHY TWO, AND NOT ONE PER THING NAMED IN THE INI COMMENT ABOVE ("walking",
; "vehicles", "production", "animation"): the executable itself only draws one
; line among these. Vehicle speed goes through its own import,
; C3D_TIMER::PowerKmh, used for nothing else at every call site checked -
; that is a clean, single-purpose lever, and it is vehicle_scale. Everything
; else - walking, construction, production, every animation, and a good deal
; of UI and camera code besides - shares the other two imports, Power and
; PowerTime, with no narrower distinction the game draws between them: Power
; alone is called from 27 different functions covering things as unrelated as
; camera zoom and vehicle acceleration curves, and PowerTime from 311. There is
; no dedicated "citizen walking speed" hook to find the way there is for
; vehicles - isolating it would mean finding and patching individual call
; sites one at a time (the way `walking` patches specific distance constants),
; not swapping one import, and that has not been attempted. So sim_scale is
; necessarily "everything but vehicles and the calendar" as one dial.

; Vehicle speed only - trucks, trains, ships, aircraft. Independent of
; everyone and everything else.
vehicle_scale = 1

; Everything else the shared simulation clock drives except vehicles: walking,
; construction, production, wear, every animation. Independent of the
; calendar and of vehicle_scale.
sim_scale     = 1

; Rotates the cycle, as a fraction of one whole cycle, 0..1. The cycle begins
; with daylight, so with 0 the night falls a little past the middle of the
; calendar day. There is no clock in the game's interface for this to disagree
; with - it only decides where in the day the dark part lands. 0.5 puts night
; near the day boundary instead.
;
; Anything other than 0 also takes `cycle_days = 13` off its exact-vanilla
; short circuit.
offset     = 0.0

; The lighting cross-fade. The engine takes a fixed 15 units to blend from one
; weathers/*.ini to the next - a quarter of a calendar day, which was a
; fiftieth of the old thirteen-day cycle and is now most of a phase. With this
; on it is scaled to the same fraction of the new, shorter phase; with it off
; a fade never finishes before the next one starts.
;
; The fade has a clock of its own (not the simulation one), which is why
; day_scale belongs in the figure and why `auto` brings it back to exactly the
; vanilla 15.
fade       = 1

; Three lines per edge and one periodic figure, which between them say whether
; the cycle runs at all and how fast:
;
;   phase N -> M         each of the thirteen steps, with how long the last one
;                        took in real milliseconds, and which date the state
;                        machine was told it was - `day 40 (as 45)`
;   lighting a -> b      each weathers/*.ini the engine was actually told to
;                        load, with the fade length and the gap since the last
;                        change
;   day N -> M           each date change, with how long that day took in real
;                        milliseconds and how many phases fitted inside it
;   N catch-up day(s)    `slow = calendar` only: how many extra calls to the
;                        pollution/loan/notification passes this tick made, and
;                        the accumulator they are tracked against
;
; The day line is the one to read first. If a day takes 3000 ms and carries 13
; phase changes, the cycle is working and simply too fast to watch - raise
; day_scale. If it carries one or none, something is wrong. Under
; `slow = calendar`, the catch-up count averaged over a real day should land
; close to day_scale itself - that is the number of "un-slowed days" that
; needed a manual pollution/loan/notice pass to keep pace with the display's
; slower one.
probe      = 0
