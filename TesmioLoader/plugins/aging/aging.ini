; aging.ini - tying a citizen's age to the calendar.
;
; THIS IS THE MEASURING HALF AND IT IS ALL THERE IS YET. The plugin reads the
; citizens and changes nothing about the game. What it is for is finding two
; numbers that static analysis could not settle:
;
;   * which field of a Person is the age
;   * how much of it a citizen gains per calendar day
;
; The second number is the whole of the correction that follows: one year of
; age per 365 of those steps.
;
; Two fields that looked like the age turned out not to be. person+0x70 is
; reset to zero inside the per-frame tick, so it is a state timer;
; person+0x65C wraps back to zero at a per-object frame count and is seeded at
; a random point at birth, so it is the walk animation. Both were nearly
; written down as facts, which is why this measures instead.
;
; It works by snapshotting whole Person objects and diffing them across
; calendar days. Run it, play for a couple of in-game weeks, and read the log:
; the age is the offset that goes up by the same small amount every day out of
; a value that looks like a human age.

[aging]

; The whole plugin.
enabled = 1

; How many citizens to follow, 1..16. They are taken spread across the live
; list rather than off the front of it, so they are not all newborns in the
; same flat.
people  = 4

; How many calendar days to report before the probe stops itself. It prints one
; block per date change, so this is also how long the log stays busy.
days    = 14

; The range of the Person object that is compared, in bytes. The object is
; 0x750 = 1872 bytes. Below 0xA8 = 168 is pointers and handles, which would
; bury the answer; the world position is above it but its values are in metres
; across a whole map, so `max` filters it out on its own.
from    = 168
to      = 1872

; Filtering. With strict = 1 a slot is only printed when it went UP and the new
; value is between min and max - a human age, in other words. Every slot is
; offered twice, once read as a float and once as an int, and the line says
; which reading passed; guessing the type is how two earlier candidates were
; got wrong. If nothing shows up after a few days, set strict = 0 to see
; everything that moved at all; the log gets long but the answer is in it.
strict  = 1
min     = 0
max     = 200
